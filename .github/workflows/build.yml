name: Build & Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      libmtk_ref:
        description: 'Branch or commit of libmozitoolkit to build JNI from'
        required: false
        default: 'main'
      release_type:
        description: 'Release type (auto, rolling, or official)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - rolling
          - official
      tag_name:
        description: 'Custom tag name (optional, only for official release)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # =========================================================================
  # 阶段 1：跨平台 JNI 动态库矩阵编译
  # =========================================================================
  build-natives:
    name: Native (${{ matrix.platform_dir }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_dir: linux-x64
            artifact_file: libmtk_jni.so
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform_dir: linux-arm64
            artifact_file: libmtk_jni.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_dir: windows-x64
            artifact_file: mtk_jni.dll
          - os: macos-latest
            target: aarch64-apple-darwin
            platform_dir: macos-arm64
            artifact_file: libmtk_jni.dylib
          - os: macos-latest
            target: x86_64-apple-darwin
            platform_dir: macos-x64
            artifact_file: libmtk_jni.dylib

    steps:
      - name: Checkout libmozitoolkit
        uses: actions/checkout@v4
        with:
          repository: MoziToolKit/libmozitoolkit
          ref: ${{ inputs.libmtk_ref || 'main' }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: jni-${{ matrix.platform_dir }}
          workspaces: ". -> target"

      - name: Build mtk-jni cdylib
        run: |
          cargo build --release -p mtk-jni --target ${{ matrix.target }}

      - name: Stage native binary
        shell: bash
        run: |
          mkdir -p stage/${{ matrix.platform_dir }}
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp -v target/${{ matrix.target }}/release/mtk_jni.dll stage/${{ matrix.platform_dir }}/
          else
            cp -v target/${{ matrix.target }}/release/${{ matrix.artifact_file }} stage/${{ matrix.platform_dir }}/
          fi
          ls -la stage/${{ matrix.platform_dir }}/

      - name: Upload platform native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform_dir }}
          path: stage/
          if-no-files-found: error

  # =========================================================================
  # 阶段 2：注入 Natives 并编译全版本 Minecraft 模组
  # =========================================================================
  build:
    name: Build Minecraft ${{ matrix.version }}
    needs: build-natives
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.20.1"
            java: 17
            distribution: "temurin"
            task: "build120"
          - version: "1.20.4"
            java: 17
            distribution: "temurin"
            task: "build1204"
          - version: "1.21.1"
            java: 21
            distribution: "temurin"
            task: "build121"
          - version: "1.21.4"
            java: 21
            distribution: "temurin"
            task: "build1214"
          - version: "26.2"
            java: 25
            distribution: "microsoft"
            task: "build26"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: common-core/src/main/resources/natives
          merge-multiple: true

      - name: Verify bundled natives layout
        run: |
          echo "=== Bundled natives structure in common-core ==="
          ls -laR common-core/src/main/resources/natives/
          test -f common-core/src/main/resources/natives/linux-x64/libmtk_jni.so
          test -f common-core/src/main/resources/natives/linux-arm64/libmtk_jni.so
          test -f common-core/src/main/resources/natives/windows-x64/mtk_jni.dll
          test -f common-core/src/main/resources/natives/macos-arm64/libmtk_jni.dylib
          test -f common-core/src/main/resources/natives/macos-x64/libmtk_jni.dylib
          echo "All 5 native platform binaries successfully bundled!"

      - name: Validate loader metadata filenames
        run: |
          # NeoForge 20.4.x uses FML 2.0.17, which only reads META-INF/mods.toml.
          test -f versions/1.20.4/neoforge/src/main/resources/META-INF/mods.toml
          # NeoForge 21.1+ uses FML 4+/11+, which reads META-INF/neoforge.mods.toml.
          for v in 1.21.1 1.21.4 26.2; do
            test -f versions/$v/neoforge/src/main/resources/META-INF/neoforge.mods.toml
          done

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.distribution }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradle wrapper executable
        run: |
          chmod +x ./gradlew
          chmod +x ./versions/${{ matrix.version }}/gradlew

      - name: Build Minecraft ${{ matrix.version }}
        run: |
          cd versions/${{ matrix.version }}
          ./gradlew build

      - name: Stage executable mod jars
        run: |
          mkdir -p build/dist-mods
          for dir in versions/${{ matrix.version }}/*/build/libs; do
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 1 -name "yefira-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp -v {} build/dist-mods/ \;
            fi
          done
          ls -lh build/dist-mods/

      - name: Upload executable mod jars
        uses: actions/upload-artifact@v4
        with:
          name: yefira-mod-jars-${{ matrix.version }}
          path: build/dist-mods/*.jar
          if-no-files-found: error

      - name: Upload sources and javadoc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yefira-sources-javadoc-${{ matrix.version }}
          path: |
            versions/${{ matrix.version }}/*/build/libs/*-sources.jar
            versions/${{ matrix.version }}/*/build/libs/*-javadoc.jar
          if-no-files-found: warn

  # =========================================================================
  # 阶段 3：GitHub Releases 聚合分发
  # =========================================================================
  publish-release:
    name: Publish Release
    needs: build
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all mod jar artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: yefira-mod-jars-*
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          set -euo pipefail
          ls -lh dist/
          cd dist
          sha256sum *.jar > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Determine Release Target
        id: release_meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.release_type }}" = "official" ] || ([ "${{ inputs.release_type }}" = "auto" ] && [ -n "${{ inputs.tag_name }}" ]); then
              TARGET_TAG="${{ inputs.tag_name }}"
              if [ -z "$TARGET_TAG" ]; then
                echo "::error::tag_name is required for official release"
                exit 1
              fi
              IS_PRERELEASE="false"
            else
              TARGET_TAG="ci-latest"
              IS_PRERELEASE="true"
            fi
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TARGET_TAG="${{ github.ref_name }}"
            IS_PRERELEASE="false"
          else
            TARGET_TAG="ci-latest"
            IS_PRERELEASE="true"
          fi

          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Target Release Tag: $TARGET_TAG (Pre-release: $IS_PRERELEASE)"

      - name: Prune stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release '$TAG' does not exist yet; nothing to prune."
            exit 0
          fi

          mapfile -t existing < <(
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | grep -E '\.jar$' || true
          )
          for name in "${existing[@]}"; do
            if [ ! -f "dist/$name" ]; then
              echo "Removing stale asset: $name"
              gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
          echo "Checked ${#existing[@]} existing jar asset(s)."

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          IS_PRERELEASE: ${{ steps.release_meta.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          if [ "$TAG" = "ci-latest" ]; then
            gh release view ci-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
              gh release create ci-latest --repo "$GITHUB_REPOSITORY" --prerelease \
                --title "Yefira Rolling Pre-release (ci-latest)" \
                --notes "Automated mod build from main branch. Updated continuously."

            printf '%s\n' \
              "Automated mod build from main branch." \
              "" \
              "### Supported Minecraft Versions" \
              "- **1.20.1** (Fabric / Forge)" \
              "- **1.20.4** (Fabric / NeoForge)" \
              "- **1.21.1** (Fabric / NeoForge)" \
              "- **1.21.4** (Fabric / NeoForge)" \
              "- **26.2** (Fabric / NeoForge)" \
              "" \
              "### Native Engine" \
              "- Embedded **libmtk-jni** (Windows x64, macOS arm64/x64, Linux x64/arm64)" \
              "" \
              "Built on $(date -u '+%Y-%m-%d %H:%M:%S UTC')." > /tmp/ci_release_notes.md

            gh release edit ci-latest --repo "$GITHUB_REPOSITORY" \
              --title "Yefira Rolling Pre-release (ci-latest)" \
              --notes-file /tmp/ci_release_notes.md

            gh release upload ci-latest dist/* --repo "$GITHUB_REPOSITORY" --clobber
            echo "Successfully updated rolling pre-release ci-latest."
          else
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG exists, uploading assets..."
              gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            else
              echo "Creating new release $TAG..."
              gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
                --title "Yefira $TAG" \
                --generate-notes \
                $( [ "$IS_PRERELEASE" = "true" ] && echo "--prerelease" || echo "" )
              gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            fi
            echo "Successfully published release $TAG."
          fi
